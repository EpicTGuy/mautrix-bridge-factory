# One entry per mautrix bridgev2 bridge packaged from the factory.
# repo: github.com/mautrix/<repo>; binary: release asset prefix; prefix: Matrix ID prefix of remote users.


# Optional keys:
#   revision       package revision, the ~ynhN of the version (default 1; bump when the package changes, not the bridge)
#   short          short network name used in sentences (default: display)
#   name           app name in the catalog (default: "Mautrix <display>")
#   network_config path of the network example config in the bridge repo (default: pkg/connector/example-config.yaml)
#   backfill       default of the "import all older chats" option (-1 = yes, 0 = no); absent = no such option
#   ghost_help / ghost_example   texts of the contact display name option
#   description_en / description_fr   catalog description (default: "... bridge for <display>")
#   network_set    fixed values in the network section, e.g. { "device_meta.os" = "Matrix (YunoHost)" }
#   [[<id>.network_options]]     boolean options of the network section, kept as settings across upgrades
# Files in bridges/<id>/ (README, doc/...) replace the generated ones.

[meta]
display = "Facebook Messenger"
short = "Messenger"
name = "Mautrix Meta (Messenger)"
repo = "meta"
binary = "mautrix-meta"
version = "v0.2610.0"
revision = 2
bot = "facebookbot"
prefix = "facebook"
command_prefix = "!fb"
port = 29319
avatar = "mxc://maunium.net/ygtkteZsXnGJLJHRchUwYWak"
alternative_to = "Messenger"
backfill = -1
ghost_help = "Go template. .DisplayName is the Messenger name and .Username the Facebook username. For example, add ' (FB)' at the end to recognise Messenger contacts at a glance."
ghost_example = '{{or .DisplayName .Username "Unknown user"}} (FB)'

[[meta.network_options]]
key = "send_presence_on_typing"
ask = "Mark you as online when you send typing notifications?"
help = "Only has an effect for encrypted chats. Full presence bridging is not supported."

[[meta.network_options]]
key = "disable_view_once"
ask = "Disable view-once messages entirely?"

[instagram]
display = "Instagram"
repo = "meta"
binary = "mautrix-instagram"
version = "v0.2610.0"
revision = 2
bot = "instagrambot"
prefix = "instagram"
command_prefix = "!ig"
port = 29330
avatar = "mxc://maunium.net/JxjlbZUlCPULEeHZSwleUXQv"
alternative_to = "Instagram"
network_config = "pkg/igconnector/example-config.yaml"
backfill = 0
ghost_help = "Go template. .DisplayName is the Instagram name and .Username the Instagram username. For example, add ' (IG)' at the end to recognise Instagram contacts at a glance."
ghost_example = '{{or .DisplayName .Username "Unknown user"}} (IG)'

[[instagram.network_options]]
key = "disable_typing"
ask = "Disable typing notification bridging?"
help = "Bridging typing notifications requires 2 extra connections to Instagram per user."

[[instagram.network_options]]
key = "disable_view_once"
ask = "Disable view-once messages entirely?"

